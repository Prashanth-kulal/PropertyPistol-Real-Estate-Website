# Local stack:  docker compose up -d   then   docker compose exec api npm run seed  
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    ports: ["27017:27017"]
  api:
    build: .
    restart: unless-stopped
    depends_on: [mongo]
    ports: ["5000:5000"]
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/propertypistol
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
volumes:
  mongo-data:
